name: An N — Calendrier Doré
on:
  schedule:
    # Chaque lundi à 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 poster_an_n.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
